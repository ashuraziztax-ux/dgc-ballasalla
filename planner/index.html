<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1d27">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Job Planner">
<title>DGC Job Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root {
  --bg:#0f1117; --surf:#1a1d27; --surf2:#222636; --bord:#2e3347;
  --accent:#f59e0b; --text:#e2e8f0; --muted:#64748b;
  --c-run:#22c55e; --c-award:#3b82f6; --c-conf:#10b981;
  --c-likely:#f97316; --c-tend:#f59e0b; --c-ph:#94a3b8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh}
a{color:var(--accent);text-decoration:none}

/* ── Header ── */
.hdr{background:var(--surf);padding:9px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--bord)}
.logo{font-size:16px;font-weight:800;color:var(--accent)}
.logo span{color:var(--text)}
.hdr-r{display:flex;align-items:center;gap:10px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.sync-dot.live{background:var(--c-run)}
.sync-dot.local{background:var(--accent)}
.ver{font-size:10px;color:var(--muted);font-weight:700}
.usr{font-size:11px;color:var(--muted);cursor:pointer}
.usr:hover{color:var(--text)}

/* ── Update banner ── */
#upd-banner{display:none;background:var(--accent);color:#1a1d27;padding:9px 14px;font-size:13px;font-weight:800;text-align:center;cursor:pointer;position:sticky;top:46px;z-index:49}
#upd-banner:hover{background:#fbbf24}

/* ── Sync notice ── */
#sync-notice{display:none;background:#1e293b;border-bottom:1px solid var(--bord);padding:5px 14px;font-size:11px;color:var(--muted)}

/* ── Nav ── */
.nav{background:var(--surf);border-bottom:1px solid var(--bord);display:flex;overflow-x:auto}
.nav button{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:13px;font-weight:700;padding:10px 16px;cursor:pointer;white-space:nowrap;font-family:inherit;transition:color .1s}
.nav button:hover{color:var(--text)}
.nav button.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── Panels ── */
.panel{display:none}.panel.active{display:block}

/* ── Timeline ── */
#tl-wrap{overflow-x:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
#tl-wrap svg text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

/* ── Jobs table ── */
.job-tbl{width:100%;border-collapse:collapse}
.job-tbl th{font-size:10px;font-weight:700;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1px solid var(--bord);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.job-tbl td{padding:7px 10px;border-bottom:1px solid var(--bord);vertical-align:middle}
.job-tbl tr:hover td{background:var(--surf);cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-right:6px}
.jname{font-weight:600;font-size:13px;line-height:1.2}
.jnote{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.wks{font-size:13px;white-space:nowrap}
.wks-delta{font-size:10px;margin-top:1px}
.wks-delta.fast{color:var(--c-run)}
.wks-delta.slow{color:#ef4444}
.ppl{font-size:13px;white-space:nowrap}
.tbl-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:3px 6px;border-radius:4px;line-height:1;font-family:inherit}
.tbl-btn:hover{color:var(--text);background:var(--surf2)}

/* ── Add bar ── */
.add-bar{padding:10px 12px}
.btn-add{background:var(--accent);color:#1a1d27;border:none;padding:7px 18px;border-radius:6px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-add:hover{background:#fbbf24}

/* ── Archive header ── */
.arch-hdr{padding:10px 12px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bord)}

/* ── Edit modal ── */
.mbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:flex-end;justify-content:center;padding:0}
.mbg.open{display:flex}
@media(min-width:500px){.mbg{align-items:center;padding:20px}}
.mbox{background:var(--surf);border:1px solid var(--bord);border-radius:18px 18px 0 0;padding:20px 18px;width:100%;max-width:440px}
@media(min-width:500px){.mbox{border-radius:16px}}
.mbox h3{font-size:15px;font-weight:700;margin-bottom:14px}
.fr{margin-bottom:11px}
.fr label{display:block;font-size:10px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.fr input,.fr select,.fr textarea{width:100%;background:var(--surf2);border:1px solid var(--bord);color:var(--text);padding:8px 10px;border-radius:7px;font-size:14px;font-family:inherit}
.fr textarea{resize:vertical;min-height:52px}
.fr input:focus,.fr select:focus,.fr textarea:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wks-calc{font-size:11px;color:var(--muted);margin-top:3px;min-height:14px}
.wks-calc.fast{color:var(--c-run)}
.wks-calc.slow{color:#ef4444}
.mac{display:flex;align-items:center;gap:8px;margin-top:14px}
.btn-sv{background:var(--accent);color:#1a1d27;border:none;padding:8px 20px;border-radius:7px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-sv:hover{background:#fbbf24}
.btn-arch{background:none;border:1px solid var(--bord);color:var(--muted);padding:7px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;margin-left:auto}
.btn-arch:hover{border-color:#ef4444;color:#ef4444}
.btn-unarch{background:none;border:1px solid var(--bord);color:var(--muted);padding:7px 12px;border-radius:7px;font-size:12px;cursor:pointer;font-family:inherit;margin-left:auto}
.btn-unarch:hover{border-color:var(--c-run);color:var(--c-run)}
.btn-cx{background:none;border:none;color:var(--muted);padding:8px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-cx:hover{color:var(--text)}

/* ── Auth / Setup ── */
.screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:900}
.auth-box{background:var(--surf);border:1px solid var(--bord);border-radius:18px;padding:28px 24px;width:100%;max-width:360px}
.auth-box h2{font-size:20px;font-weight:800;color:var(--accent);margin-bottom:3px}
.auth-box .sub{font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.5}
.ai{display:block;width:100%;background:var(--surf2);border:1px solid var(--bord);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:10px}
.ai:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.btn-p{width:100%;background:var(--accent);color:#1a1d27;border:none;padding:11px;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-p:hover{background:#fbbf24}
.or-div{text-align:center;font-size:11px;color:var(--muted);margin:10px 0}
.btn-l{width:100%;background:none;border:1px solid var(--bord);color:var(--muted);padding:10px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit}
.btn-l:hover{border-color:var(--text);color:var(--text)}
.err{color:#ef4444;font-size:12px;margin-bottom:8px;min-height:16px}
.setup-note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.5}
.setup-note a{color:var(--accent)}

@media(max-width:480px){
  .job-tbl th:nth-child(4),.job-tbl td:nth-child(4){display:none}
  .jnote{max-width:120px}
}
</style>
</head>
<body>

<!-- ── Main app ── -->
<div id="app">

  <div id="upd-banner" onclick="applyUpdate()">New version available — tap to update</div>

  <div class="hdr">
    <div class="logo">DGC <span>Job Planner</span></div>
    <div class="hdr-r">
      <span class="ver" id="ver-badge"></span>
      <span class="sync-dot" id="sync-dot" title="Sync status"></span>
      <span class="usr" id="usr-badge"></span>
    </div>
  </div>

  <div id="sync-notice">Running in local mode — data is saved on this device only.</div>

  <div class="nav">
    <button class="active" onclick="showTab('timeline',this)">📅 Timeline</button>
    <button onclick="showTab('jobs',this)">💼 Jobs</button>
    <button onclick="showTab('archive',this)" id="arch-tab-btn">📦 Archive</button>
  </div>

  <!-- Timeline tab -->
  <div id="tab-timeline" class="panel active">
    <div id="tl-wrap"><div id="tl-svg"></div></div>
  </div>

  <!-- Jobs tab -->
  <div id="tab-jobs" class="panel">
    <div class="add-bar"><button class="btn-add" onclick="openAdd()">+ Add Job</button></div>
    <div style="overflow-x:auto">
      <table class="job-tbl">
        <thead><tr>
          <th>Job</th>
          <th>Weeks</th>
          <th>People</th>
          <th>Status</th>
          <th></th>
        </tr></thead>
        <tbody id="jobs-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Archive tab -->
  <div id="tab-archive" class="panel">
    <div class="arch-hdr">Archived jobs</div>
    <div style="overflow-x:auto">
      <table class="job-tbl">
        <thead><tr>
          <th>Job</th>
          <th>Weeks</th>
          <th>People</th>
          <th>Status</th>
          <th></th>
        </tr></thead>
        <tbody id="archive-body"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- ── Edit modal ── -->
<div class="mbg" id="edit-modal" onclick="modalBgClick(event)">
  <div class="mbox">
    <h3 id="modal-title">Edit Job</h3>
    <input type="hidden" id="m-id">
    <div class="fr"><label>Job name</label><input id="m-name" type="text" placeholder="Job name"></div>
    <div class="fgrid">
      <div class="fr">
        <label>Weeks on site</label>
        <input id="m-weeks" type="number" min="1" max="200" oninput="calcPreview()">
      </div>
      <div class="fr">
        <label>People needed</label>
        <input id="m-needed" type="number" min="1" max="50" oninput="calcPreview()">
      </div>
    </div>
    <div class="fr">
      <label>People on site</label>
      <input id="m-onsite" type="number" min="0" max="50" oninput="calcPreview()">
      <div class="wks-calc" id="wks-preview"></div>
    </div>
    <div class="fgrid">
      <div class="fr">
        <label>Start date</label>
        <input id="m-start" type="date" oninput="calcPreview()">
      </div>
      <div class="fr">
        <label>Finish date <span style="font-size:10px;color:#64748b">(working days)</span></label>
        <input id="m-finish" type="date" oninput="onFinishChange()">
      </div>
    </div>
    <div class="fr">
      <label>Status</label>
      <select id="m-status">
        <option value="running">Running</option>
        <option value="awarded">Awarded</option>
        <option value="confirmed">Confirmed</option>
        <option value="tendering_likely">Tendering — Likely</option>
        <option value="tendering">Tendering</option>
        <option value="placeholder">Placeholder</option>
      </select>
    </div>
    <div class="fr"><label>Note</label><textarea id="m-note" rows="2" placeholder="Any notes..."></textarea></div>
    <div class="mac">
      <button class="btn-sv" onclick="saveModal()">Save</button>
      <button class="btn-cx" onclick="closeModal()">Cancel</button>
      <button class="btn-arch" id="btn-archive-action" onclick="archiveJob()">Archive</button>
    </div>
  </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────────
const VERSION = 'v2.1';
const BUILD   = 'Aug 2026';
const SB_URL  = 'https://vigdtpcgeqenznuakdwz.supabase.co';
const SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZpZ2R0cGNnZXFlbnpudWFrZHd6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0MTI1MzQsImV4cCI6MjEwMjk4ODUzNH0.9hjdS6ATFVaYwwKcZQqTpQxbIuSDrxbO07r4MmXXadQ';
const L_JOBS_K  = 'dgc_jobs_v2';
const SW_PATH   = 'sw.js';
const _local    = false; // always use Supabase — no local mode

const STATUS_COL = {
  running:'#22c55e', awarded:'#3b82f6', confirmed:'#10b981',
  tendering_likely:'#f97316', tendering:'#f59e0b', placeholder:'#94a3b8'
};
const STATUS_LBL = {
  running:'Running', awarded:'Awarded', confirmed:'Confirmed',
  tendering_likely:'Tendering — Likely', tendering:'Tendering', placeholder:'Placeholder'
};

const SEEDS = [
  { name:'Peel Breakwater (DOI)',  base_weeks:10, people_needed:5, people_on_site:5, start_date:'2026-08-10', status:'awarded',  on_timeline:true, archived:false, note:'AWARDED — DoI sewage treatment works, Peel harbour. Concrete build.' },
  { name:'Utmost KEBH (car park)', base_weeks:10, people_needed:4, people_on_site:4, start_date:'2026-08-31', status:'awarded',  on_timeline:true, archived:false, note:'AWARDED — Car park waterproofing, King Edward Bay House, Onchan. PC 5 Nov 2026.' },
  { name:'Gansey CSO',             base_weeks:6,  people_needed:3, people_on_site:3, start_date:'2026-09-13', status:'awarded',  on_timeline:true, archived:false, note:'AWARDED — CSO screen installation. £82,136.17. DEFA/DoI approvals required.' },
  { name:'Dandara Dayworks',       base_weeks:4,  people_needed:2, people_on_site:2, start_date:'2026-07-28', status:'running',  on_timeline:true, archived:false, note:'Update as daywork instructions land.' }
];

// ── State ──────────────────────────────────────────────────
let _sb   = null;
let _swReg = null;
let _editArchived = false;

// ── Service Worker ─────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register(SW_PATH).then(r => {
    _swReg = r;
    r.addEventListener('updatefound', () => {
      const w = r.installing;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) {
          document.getElementById('upd-banner').style.display = 'block';
        }
      });
    });
  });
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
}
function applyUpdate() {
  if (_swReg && _swReg.waiting) _swReg.waiting.postMessage({ type:'SKIP_WAITING' });
}

// ── Version badge ──────────────────────────────────────────
document.getElementById('ver-badge').textContent = VERSION + ' · ' + BUILD;

// ── Week calc ──────────────────────────────────────────────
function revisedWeeks(j) {
  if (!j.people_on_site || j.people_on_site <= 0) return j.base_weeks;
  return Math.ceil(j.base_weeks * j.people_needed / j.people_on_site);
}

// ── Date helpers ───────────────────────────────────────────
function toDateStr(d) {
  // YYYY-MM-DD from Date object
  return d.toISOString().substring(0,10);
}
function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + days);
  return toDateStr(d);
}
function fmtDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
}
function mondayOf(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay(); // 0=Sun
  const diff = (dow === 0 ? -6 : 1 - dow);
  d.setDate(d.getDate() + diff);
  return toDateStr(d);
}
function daysBetween(a, b) {
  return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000);
}
function nextWorkingDay() {
  const d = new Date();
  do { d.setDate(d.getDate() + 1); } while (d.getDay() === 0 || d.getDay() === 6);
  return toDateStr(d);
}

// ── Isle of Man bank holidays ──────────────────────────────
const IOM_BH = new Set([
  '2025-01-01','2025-04-18','2025-04-21','2025-05-05','2025-07-07','2025-08-25','2025-12-25','2025-12-26',
  '2026-01-01','2026-04-03','2026-04-06','2026-05-04','2026-07-06','2026-08-31','2026-12-25','2026-12-28',
  '2027-01-01','2027-03-26','2027-03-29','2027-05-03','2027-07-05','2027-08-30','2027-12-27','2027-12-28',
  '2028-01-03','2028-04-14','2028-04-17','2028-05-01','2028-07-05','2028-08-26','2028-12-25','2028-12-26',
]);
function isWorkingDay(dateStr) {
  const dow = new Date(dateStr + 'T12:00:00').getDay();
  return dow !== 0 && dow !== 6 && !IOM_BH.has(dateStr);
}
function addWorkingDays(dateStr, days) {
  const d = new Date(dateStr + 'T12:00:00');
  let rem = Math.abs(Math.round(days));
  const dir = days >= 0 ? 1 : -1;
  while (rem > 0) { d.setDate(d.getDate() + dir); if (isWorkingDay(toDateStr(d))) rem--; }
  return toDateStr(d);
}
function workingDaysBetween(startStr, endStr) {
  const end = new Date(endStr + 'T12:00:00');
  const d = new Date(startStr + 'T12:00:00');
  if (end <= d) return 0;
  let count = 0;
  while (d < end) { d.setDate(d.getDate() + 1); if (isWorkingDay(toDateStr(d))) count++; }
  return count;
}

// For running jobs, end date anchors to next working day + revised weeks
// For future jobs, end date anchors to start + revised weeks
function jobEndDate(j) {
  const today = toDateStr(new Date());
  const rw = revisedWeeks(j);
  const start = j.start_date || today;
  const anchor = start <= today ? nextWorkingDay() : start;
  return addWorkingDays(anchor, rw * 5);
}

// ── Local jobs ─────────────────────────────────────────────
function loadLocal() {
  try { const d = JSON.parse(localStorage.getItem(L_JOBS_K)||'[]'); if (Array.isArray(d) && d.length) return d; } catch(e) {}
  // First time — seed
  const seeds = SEEDS.map((s,i) => Object.assign({ id: 'local-'+(i+1), created_at: new Date().toISOString() }, s));
  saveLocal(seeds);
  return seeds;
}
function saveLocal(jobs) {
  localStorage.setItem(L_JOBS_K, JSON.stringify(jobs));
}

// ── Supabase CRUD ──────────────────────────────────────────
async function sbLoad() {
  const { data, error } = await _sb.from('dgc_planner_jobs').select('*').order('start_date');
  if (error) { console.error(error); return []; }
  if (!data.length) {
    // Seed Supabase on first use
    for (const s of SEEDS) {
      await _sb.from('dgc_planner_jobs').insert(s);
    }
    const { data: d2 } = await _sb.from('dgc_planner_jobs').select('*').order('start_date');
    return d2 || [];
  }
  return data;
}
async function sbUpsert(job) {
  if (job.id) {
    job.updated_at = new Date().toISOString();
    const { error } = await _sb.from('dgc_planner_jobs').upsert(job);
    if (error) console.error(error);
  } else {
    const { error } = await _sb.from('dgc_planner_jobs').insert(job);
    if (error) console.error(error);
  }
}
async function sbDelete(id) {
  await _sb.from('dgc_planner_jobs').delete().eq('id', id);
}

// ── Unified load/save ──────────────────────────────────────
async function loadJobs() {
  if (_local) return loadLocal();
  return sbLoad();
}
async function upsertJob(job) {
  if (_local) {
    const jobs = loadLocal();
    const idx = jobs.findIndex(j => j.id === job.id);
    if (idx >= 0) jobs[idx] = job; else jobs.push(job);
    saveLocal(jobs);
  } else {
    await sbUpsert(job);
  }
  await refresh();
}
async function removeJob(id) {
  if (_local) {
    const jobs = loadLocal().filter(j => j.id !== id);
    saveLocal(jobs);
  } else {
    await sbDelete(id);
  }
  await refresh();
}

// ── Refresh ────────────────────────────────────────────────
let _jobs = [];
async function refresh() {
  _jobs = await loadJobs();
  renderTimeline(_jobs.filter(j => !j.archived && j.on_timeline !== false));
  renderTable(_jobs.filter(j => !j.archived), 'jobs-body', false);
  renderTable(_jobs.filter(j => j.archived), 'archive-body', true);
}

// ── Realtime ───────────────────────────────────────────────
function initRealtime() {
  if (!_sb) return;
  _sb.channel('plan-jobs')
    .on('postgres_changes', { event:'*', schema:'public', table:'dgc_planner_jobs' }, () => refresh())
    .subscribe();
}

// ── Timeline (SVG Gantt) ───────────────────────────────────
// ── Drag state ─────────────────────────────────────────────
let _drag = null;
let _wasDrag = false;
let _origin = null; // current timeline origin (Monday of this week), set by renderTimeline

function renderTimeline(jobs) {
  const W_PX  = 52;   // px per week
  const ROW_H = 46;
  const HEAD_H = 44;  // two-line header
  const FOOT_H = 56;  // gang chart footer
  const LBL_W = 130;
  const WEEKS  = 26;

  const today = toDateStr(new Date());
  const origin = mondayOf(today); // first Monday of current week
  _origin = origin; // expose for drag handlers

  const svgW = LBL_W + WEEKS * W_PX + 20;
  const svgH = HEAD_H + Math.max(jobs.length,1) * ROW_H + FOOT_H;

  let s = `<svg width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="display:block">`;

  // Week column backgrounds + full Mon/date headers every week
  for (let w = 0; w < WEEKS; w++) {
    const wDate = addDays(origin, w * 7);
    const x = LBL_W + w * W_PX;
    const isEven = w % 2 === 0;
    s += `<rect x="${x}" y="0" width="${W_PX}" height="${svgH}" fill="${isEven?'#1a1d27':'#1e2130'}" />`;
    const d = new Date(wDate+'T12:00:00');
    const dayName = d.toLocaleDateString('en-GB',{weekday:'short'});
    const dateLbl = d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    const cx = x + W_PX / 2;
    s += `<text x="${cx}" y="16" font-size="8" text-anchor="middle" fill="#475569" font-weight="600">${dayName}</text>`;
    s += `<text x="${cx}" y="32" font-size="9" text-anchor="middle" fill="#94a3b8" font-weight="700">${dateLbl}</text>`;
  }

  // Today line
  const todayOff = daysBetween(origin, today);
  const todayX   = LBL_W + (todayOff / 7) * W_PX;
  s += `<line x1="${todayX}" y1="${HEAD_H}" x2="${todayX}" y2="${svgH - FOOT_H}" stroke="#f59e0b" stroke-width="1.5" opacity=".6" stroke-dasharray="4,3"/>`;
  s += `<text x="${todayX+3}" y="${HEAD_H-8}" font-size="9" fill="#f59e0b" font-weight="700">Today</text>`;

  // Label column bg
  s += `<rect x="0" y="0" width="${LBL_W}" height="${svgH}" fill="#0f1117"/>`;
  s += `<line x1="${LBL_W}" y1="${HEAD_H}" x2="${LBL_W}" y2="${svgH}" stroke="#2e3347" stroke-width="1"/>`;

  // Job rows
  if (!jobs.length) {
    s += `<text x="${LBL_W + 20}" y="${HEAD_H + 28}" font-size="13" fill="#64748b">No jobs on timeline. Add jobs in the Jobs tab.</text>`;
  }
  jobs.forEach((j, i) => {
    const y0 = HEAD_H + i * ROW_H;
    const y1 = y0 + ROW_H;
    const by = y0 + 7;
    const bh = ROW_H - 14;
    const col = STATUS_COL[j.status] || '#94a3b8';
    const rw  = revisedWeeks(j);

    // Row separator
    s += `<line x1="0" y1="${y1}" x2="${svgW}" y2="${y1}" stroke="#2e3347" stroke-width=".5" opacity=".6"/>`;

    // Label
    const lbl = j.name.length > 16 ? j.name.substring(0,15)+'…' : j.name;
    s += `<text x="${LBL_W-8}" y="${by + bh/2 + 4}" font-size="12" text-anchor="end" fill="#e2e8f0" font-weight="600">${esc(lbl)}</text>`;

    // Bar position — end anchors to next working day for running jobs
    const startOff = daysBetween(origin, j.start_date || today);
    const bx = LBL_W + (startOff / 7) * W_PX;
    const endDate = jobEndDate(j);
    const endOff = daysBetween(origin, endDate);
    const bEnd = LBL_W + (endOff / 7) * W_PX;
    const bw = Math.max(bEnd - bx, 8);

    // Bar (clip to visible area)
    if (bx < LBL_W + WEEKS * W_PX && bx + bw > LBL_W) {
      const cx = Math.max(bx, LBL_W);
      const cw = Math.min(bx + bw, LBL_W + WEEKS * W_PX) - cx;
      s += `<rect x="${cx}" y="${by}" width="${cw}" height="${bh}" rx="5" fill="${col}" opacity=".85" data-id="${j.id}" class="tl-bar" style="cursor:pointer"/>`;
      // People badge
      if (bw > 28) {
        const bBadgeX = Math.min(bx + bw - 20, LBL_W + WEEKS * W_PX - 20);
        s += `<circle cx="${bBadgeX}" cy="${by+bh/2}" r="11" fill="${col}" stroke="white" stroke-width="1.5" data-id="${j.id}" class="tl-badge" style="cursor:pointer"/>`;
        s += `<text x="${bBadgeX}" y="${by+bh/2+4}" font-size="10" text-anchor="middle" fill="white" font-weight="900" pointer-events="none">${j.people_on_site}</text>`;
      }
      // Job name on bar if wide enough
      if (bw > 60) {
        const txtX = cx + 7;
        const maxChars = Math.floor(cw / 7);
        const barLbl = j.name.length > maxChars ? j.name.substring(0, maxChars-1)+'…' : j.name;
        s += `<text x="${txtX}" y="${by+bh/2+4}" font-size="11" fill="white" font-weight="700" pointer-events="none">${esc(barLbl)}</text>`;
      }
      // End date label to the right of bar
      const endLblX = Math.min(bEnd + 4, LBL_W + WEEKS * W_PX - 2);
      if (endLblX < LBL_W + WEEKS * W_PX - 10) {
        s += `<text x="${endLblX}" y="${by+bh/2+4}" font-size="9" fill="${col}" font-weight="700" opacity="0.9" pointer-events="none">${fmtDate(endDate)}</text>`;
      }
    }
  });

  // ── Gang footer — total people per week ──────────────────
  const footY = HEAD_H + Math.max(jobs.length,1) * ROW_H;
  s += `<rect x="0" y="${footY}" width="${svgW}" height="${FOOT_H}" fill="#0a0d14"/>`;
  s += `<line x1="0" y1="${footY}" x2="${svgW}" y2="${footY}" stroke="#2e3347" stroke-width="1"/>`;
  s += `<text x="${LBL_W-8}" y="${footY+FOOT_H/2+4}" font-size="11" text-anchor="end" fill="#64748b" font-weight="700">Gang</text>`;

  // Tally people per week
  const weekPpl = [];
  for (let w = 0; w < WEEKS; w++) {
    const wStart = addDays(origin, w * 7);
    const wEnd   = addDays(origin, (w + 1) * 7);
    let total = 0;
    jobs.forEach(j => {
      const jStart = j.start_date || today;
      const jEnd   = jobEndDate(j);
      if (jStart < wEnd && jEnd > wStart) total += (j.people_on_site || j.people_needed || 0);
    });
    weekPpl.push(total);
  }
  const maxPpl = Math.max(...weekPpl, 1); // for bar height scaling only
  // Fixed capacity = sum of all jobs' people_needed (stable regardless of job positions)
  const GANG_CAP = Math.max(jobs.reduce((s, j) => s + (j.people_needed || j.people_on_site || 0), 0), 1);
  const barZone = FOOT_H - 20; // px available for bars

  for (let w = 0; w < WEEKS; w++) {
    const ppl = weekPpl[w];
    if (!ppl) continue;
    const x = LBL_W + w * W_PX;
    const barH = Math.max(Math.round((ppl / maxPpl) * barZone), 4);
    const barY = footY + FOOT_H - barH - 12;
    const ratio = ppl / GANG_CAP; // colour based on fixed capacity — stable as jobs move
    const barCol = ratio > 0.85 ? '#ef4444' : ratio > 0.5 ? '#f59e0b' : '#22c55e';
    s += `<rect x="${x+3}" y="${barY}" width="${W_PX-6}" height="${barH}" rx="3" fill="${barCol}" opacity=".85"/>`;
    s += `<text x="${x+W_PX/2}" y="${footY+FOOT_H-2}" font-size="9" text-anchor="middle" fill="${barCol}" font-weight="800">${ppl}</text>`;
  }

  s += '</svg>';
  document.getElementById('tl-svg').innerHTML = s;

  // Bar: drag to move start date, or click to edit
  document.querySelectorAll('.tl-bar').forEach(el => {
    el.style.cursor = 'grab';
    el.addEventListener('mousedown', e => {
      const j = _jobs.find(x => x.id == el.getAttribute('data-id'));
      if (!j) return;
      const actualStart = j.start_date || toDateStr(new Date());
      // For bars starting before the visible timeline, anchor drag to origin so tooltip shows sensible dates
      const startOff = _origin ? daysBetween(_origin, actualStart) : 0;
      const dragAnchor = (startOff < 0 && _origin) ? _origin : actualStart;
      _drag = { job: j, origX: e.clientX, origStart: actualStart, dragAnchor, lastDeltaDays: null };
      _wasDrag = false;
      e.preventDefault();
    });
    el.addEventListener('touchstart', e => {
      const j = _jobs.find(x => x.id == el.getAttribute('data-id'));
      if (!j) return;
      const actualStart = j.start_date || toDateStr(new Date());
      const startOff = _origin ? daysBetween(_origin, actualStart) : 0;
      const dragAnchor = (startOff < 0 && _origin) ? _origin : actualStart;
      _drag = { job: j, origX: e.touches[0].clientX, origStart: actualStart, dragAnchor, lastDeltaDays: null };
      _wasDrag = false;
    }, { passive: true });
    el.addEventListener('click', () => {
      if (_wasDrag) { _wasDrag = false; return; }
      const j = _jobs.find(x => x.id == el.getAttribute('data-id'));
      if (j) openEdit(j);
    });
  });
  // Click badge → inline people editor
  document.querySelectorAll('.tl-badge').forEach(el => {
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      const j = _jobs.find(x => x.id == el.getAttribute('data-id'));
      if (!j) return;
      showPeopleEditor(el, j);
    });
  });
}

function showPeopleEditor(badgeEl, job) {
  const old = document.getElementById('ppl-editor');
  if (old) old.remove();
  const br = badgeEl.getBoundingClientRect();
  const wrap = document.createElement('div');
  wrap.id = 'ppl-editor';
  wrap.style.cssText = 'position:fixed;z-index:9999;left:'+(br.left-28)+'px;top:'+(br.top-38)+'px;background:#1a1d27;border:2px solid #f59e0b;border-radius:10px;padding:5px 6px 4px;box-shadow:0 4px 24px rgba(0,0,0,.6);text-align:center';
  const lbl = document.createElement('div');
  lbl.style.cssText = 'font-size:9px;color:#94a3b8;font-weight:700;margin-bottom:3px;text-transform:uppercase';
  lbl.textContent = 'On site';
  const inp = document.createElement('input');
  inp.type = 'number'; inp.min = '0'; inp.max = '50';
  inp.value = job.people_on_site;
  inp.style.cssText = 'width:52px;background:#222636;border:1px solid #2e3347;color:#e2e8f0;border-radius:6px;padding:3px 6px;font-size:15px;font-weight:800;text-align:center;font-family:inherit';
  wrap.appendChild(lbl); wrap.appendChild(inp);
  document.body.appendChild(wrap);
  inp.focus(); inp.select();
  function save() {
    const v = parseInt(inp.value) || 0;
    if (v !== job.people_on_site) { job.people_on_site = v; upsertJob(job); }
    wrap.remove();
  }
  inp.addEventListener('keydown', e => { if (e.key==='Enter') save(); if (e.key==='Escape') wrap.remove(); });
  inp.addEventListener('blur', () => setTimeout(() => wrap.remove(), 150));
  document.addEventListener('click', () => wrap.remove(), { once:true });
}

// ── Jobs table ────────────────────────────────────────────
function renderTable(jobs, bodyId, isArchive) {
  const tb = document.getElementById(bodyId);
  if (!jobs.length) {
    tb.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">${isArchive?'No archived jobs.':'No active jobs — add one above.'}</td></tr>`;
    return;
  }
  tb.innerHTML = jobs.map(j => {
    const col = STATUS_COL[j.status]||'#94a3b8';
    const rw  = revisedWeeks(j);
    const endDate = addDays(j.start_date || toDateStr(new Date()), rw * 7);
    let wksDelta = '';
    if (j.people_on_site !== j.people_needed && j.people_on_site > 0) {
      const diff = rw - j.base_weeks;
      const cls  = diff < 0 ? 'fast' : 'slow';
      const sign  = diff < 0 ? '↓' : '↑';
      wksDelta = `<div class="wks-delta ${cls}">${sign} ${Math.abs(diff)}w vs base ${j.base_weeks}w</div>`;
    }
    const pplNote = j.people_on_site !== j.people_needed ? ` <span style="color:var(--muted)">(${j.people_needed} needed)</span>` : '';
    const statusLbl = STATUS_LBL[j.status]||j.status;
    const note = (j.note||'').substring(0,60);
    return `<tr onclick="openEdit(_jobs.find(x=>x.id=='${j.id}'))">
      <td>
        <div style="display:flex;align-items:flex-start;gap:0">
          <span class="dot" style="background:${col};margin-top:3px"></span>
          <div>
            <div class="jname">${esc(j.name)}</div>
            ${note ? `<div class="jnote">${esc(note)}</div>` : ''}
          </div>
        </div>
      </td>
      <td>
        <div class="wks">${rw}w</div>
        ${wksDelta}
        <div style="font-size:10px;color:var(--muted)">${fmtDate(j.start_date)} → ${fmtDate(endDate)}</div>
      </td>
      <td><div class="ppl">${j.people_on_site}${pplNote}</div></td>
      <td><span style="font-size:11px;font-weight:600;color:${col}">${statusLbl}</span></td>
      <td><button class="tbl-btn" title="Edit" onclick="event.stopPropagation();openEdit(_jobs.find(x=>x.id=='${j.id}'))">✏️</button></td>
    </tr>`;
  }).join('');
}

// ── Edit modal ────────────────────────────────────────────
function openAdd() {
  _editArchived = false;
  document.getElementById('modal-title').textContent = 'New Job';
  document.getElementById('m-id').value = '';
  document.getElementById('m-name').value = '';
  document.getElementById('m-weeks').value = 4;
  document.getElementById('m-needed').value = 2;
  document.getElementById('m-onsite').value = 2;
  document.getElementById('m-start').value = toDateStr(new Date());
  document.getElementById('m-status').value = 'tendering';
  document.getElementById('m-note').value = '';
  document.getElementById('btn-archive-action').style.display = 'none';
  calcPreview();
  document.getElementById('edit-modal').classList.add('open');
  document.getElementById('m-name').focus();
}
function openEdit(j) {
  if (!j) return;
  _editArchived = !!j.archived;
  document.getElementById('modal-title').textContent = j.archived ? 'Archived Job' : 'Edit Job';
  document.getElementById('m-id').value = j.id;
  document.getElementById('m-name').value = j.name;
  document.getElementById('m-weeks').value = j.base_weeks;
  document.getElementById('m-needed').value = j.people_needed;
  document.getElementById('m-onsite').value = j.people_on_site;
  const sd = j.start_date || toDateStr(new Date());
  document.getElementById('m-start').value = sd;
  document.getElementById('m-finish').value = addWorkingDays(sd, (j.base_weeks || 1) * 5);
  document.getElementById('m-status').value = j.status;
  document.getElementById('m-note').value = j.note||'';
  const archBtn = document.getElementById('btn-archive-action');
  archBtn.style.display = '';
  archBtn.textContent = j.archived ? 'Restore' : 'Archive';
  archBtn.className = j.archived ? 'btn-unarch' : 'btn-arch';
  calcPreview();
  document.getElementById('edit-modal').classList.add('open');
}
function closeModal() { document.getElementById('edit-modal').classList.remove('open'); }
function modalBgClick(e) { if (e.target === document.getElementById('edit-modal')) closeModal(); }

let _finishLock = false;
function calcPreview() {
  const bw = parseInt(document.getElementById('m-weeks').value)||0;
  const np = parseInt(document.getElementById('m-needed').value)||0;
  const os = parseInt(document.getElementById('m-onsite').value)||0;
  const start = document.getElementById('m-start').value;
  const prev = document.getElementById('wks-preview');
  if (start && bw && !_finishLock) {
    document.getElementById('m-finish').value = addWorkingDays(start, bw * 5);
  }
  if (!bw || !np || !os) { prev.textContent = ''; return; }
  const rw = Math.ceil(bw * np / os);
  if (os === np) { prev.textContent = `${rw} working weeks at full staffing`; prev.className = 'wks-calc'; }
  else if (os > np) { prev.textContent = `${rw} working weeks ↓ (${bw}w base at ${np} people)`; prev.className = 'wks-calc fast'; }
  else { prev.textContent = `${rw} working weeks ↑ (${bw}w base at ${np} people)`; prev.className = 'wks-calc slow'; }
}
function onFinishChange() {
  const start = document.getElementById('m-start').value;
  const finish = document.getElementById('m-finish').value;
  if (!start || !finish || finish <= start) return;
  _finishLock = true;
  document.getElementById('m-weeks').value = Math.max(1, Math.round(workingDaysBetween(start, finish) / 5));
  calcPreview();
  _finishLock = false;
}

async function saveModal() {
  const id = document.getElementById('m-id').value;
  const job = {
    name: document.getElementById('m-name').value.trim() || 'New Job',
    base_weeks: parseInt(document.getElementById('m-weeks').value)||4,
    people_needed: parseInt(document.getElementById('m-needed').value)||2,
    people_on_site: parseInt(document.getElementById('m-onsite').value)||2,
    start_date: document.getElementById('m-start').value || toDateStr(new Date()),
    status: document.getElementById('m-status').value,
    note: document.getElementById('m-note').value.trim(),
    on_timeline: true,
    archived: _editArchived
  };
  if (id) job.id = _local ? id : id;
  else if (_local) job.id = 'local-' + Date.now();
  closeModal();
  await upsertJob(job);
}

async function archiveJob() {
  const id = document.getElementById('m-id').value;
  if (!id) return;
  const j = _jobs.find(x => x.id == id);
  if (!j) return;
  j.archived = !j.archived;
  closeModal();
  await upsertJob(j);
}

// ── Tabs ──────────────────────────────────────────────────
function showTab(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}

// ── Boot ──────────────────────────────────────────────────
async function bootApp() {
  document.getElementById('sync-dot').className = 'sync-dot live';
  initRealtime();
  await refresh();
}

// ── Escape helper ─────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──────────────────────────────────────────────────
(async function init() {
  _sb = window.supabase.createClient(SB_URL, SB_KEY);
  await bootApp();
})();

// ── Drag tooltip ──────────────────────────────────────────
function showDragTooltip(x, y, dateStr) {
  let tt = document.getElementById('drag-tt');
  if (!tt) {
    tt = document.createElement('div');
    tt.id = 'drag-tt';
    tt.style.cssText = 'position:fixed;z-index:9999;background:#f59e0b;color:#1a1d27;font-size:12px;font-weight:800;padding:4px 9px;border-radius:7px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5)';
    document.body.appendChild(tt);
  }
  tt.textContent = '→ ' + fmtDate(dateStr);
  tt.style.left = (x + 14) + 'px';
  tt.style.top  = (y - 32) + 'px';
  tt.style.display = 'block';
}
function hideDragTooltip() {
  const tt = document.getElementById('drag-tt');
  if (tt) tt.style.display = 'none';
}

// ── Global drag handlers (mouse) ──────────────────────────
const _W_PX = 52;

function _applyDragMove(clientX, clientY) {
  if (!_drag) return;
  const deltaX = clientX - _drag.origX;
  const deltaDays = Math.round((deltaX / _W_PX) * 7);
  if (Math.abs(deltaDays) >= 1) _wasDrag = true;
  // Always update tooltip position
  const previewDate = addDays(_drag.dragAnchor, deltaDays);
  showDragTooltip(clientX, clientY, previewDate);
  // Re-render SVG only when snapped week changes
  if (deltaDays === _drag.lastDeltaDays) return;
  _drag.lastDeltaDays = deltaDays;
  const j = _jobs.find(x => x.id == _drag.job.id);
  if (!j) return;
  j.start_date = previewDate;
  const tl = document.getElementById('tab-timeline');
  if (tl && tl.classList.contains('active')) renderTimeline(_jobs.filter(x => x.on_timeline && !x.archived));
}

window.addEventListener('mousemove', e => { _applyDragMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', async e => {
  hideDragTooltip();
  if (!_drag) return;
  const deltaX = e.clientX - _drag.origX;
  const deltaDays = Math.round((deltaX / _W_PX) * 7);
  const { job, origStart, dragAnchor } = _drag;
  _drag = null;
  const j = _jobs.find(x => x.id == job.id);
  if (!j) return;
  if (Math.abs(deltaDays) >= 1) {
    _wasDrag = true;
    j.start_date = addDays(dragAnchor, deltaDays);
    await upsertJob(j);
  } else {
    j.start_date = origStart; // restore if no meaningful drag
    renderTimeline(_jobs.filter(x => x.on_timeline && !x.archived));
  }
});

// ── Global drag handlers (touch) ──────────────────────────
window.addEventListener('touchmove', e => {
  if (!_drag) return;
  _applyDragMove(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
window.addEventListener('touchend', async e => {
  hideDragTooltip();
  if (!_drag) return;
  const touch = e.changedTouches[0];
  const deltaX = touch.clientX - _drag.origX;
  const deltaDays = Math.round((deltaX / _W_PX) * 7);
  const { job, origStart, dragAnchor } = _drag;
  _drag = null;
  const j = _jobs.find(x => x.id == job.id);
  if (!j) return;
  if (Math.abs(deltaDays) >= 1) {
    _wasDrag = true;
    j.start_date = addDays(dragAnchor, deltaDays);
    await upsertJob(j);
  } else {
    j.start_date = origStart;
    renderTimeline(_jobs.filter(x => x.on_timeline && !x.archived));
  }
});
</script>
